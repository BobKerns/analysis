<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@600;800;900&family=JetBrains+Mono:wght@400&display=swap">
<style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden}
.c{position:relative;width:1280px;height:640px;background:url(scene.jpg) center/cover;font-family:Inter,Arial,sans-serif}
.host{position:absolute;left:0;bottom:0;height:640px;width:640px;background:url(host.png) center/cover}
.w{position:absolute;left:640px;right:52px;top:56px;display:grid;gap:16px;justify-items:end;text-align:right}
b{font-weight:900;font-size:82px;line-height:.98;color:#f7c37a;letter-spacing:-1.6px;text-shadow:0 4px 18px rgba(20,10,40,.55)}
