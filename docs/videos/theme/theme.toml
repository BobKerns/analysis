# The look every video shares. Slides read [palette] and [fonts] as CSS
# variables (--bg, --font-heading, ...); tapes read [terminal]; narration
# reads [narration.<lang>]. Changing a value here re-renders every scene
# that uses it, and only those.

[video]
# The layout size: slides and the terminal are designed at 1920x1080.
width = 1920
height = 1080
# Output pixels per layout pixel. 2 renders at 4K (3840x2160): YouTube
# encodes 4K uploads at a much higher bitrate, which keeps terminal text
# sharp even for viewers watching at 1080p.
scale = 2
fps = 30

[timing]
# Seconds of picture before the narration starts and after it ends.
lead = 0.6
tail = 0.9
# Pause between sentences.
sentence_gap = 0.35
# Slides fade in from and out to the background color.
slide_fade = 0.5

[palette]
bg = "#10242f"
surface = "#1b3a48"
ink = "#f4efe6"
muted = "#a9bcc4"
accent = "#f2a541"   # warm gold: titles, the prompt
accent2 = "#4fb3a9"  # teal: Alice
accent3 = "#e07a5f"  # terracotta: Bill
ground = "#2c5a4a"

[fonts]
# Stacks, so a machine without the first font still renders.
# The CJK fonts after the Latin ones cover Japanese slides: Chromium takes
# each character from the first font that has it. The video image installs
# Noto Sans CJK; macOS has Hiragino.
heading = "'Inter Display', Inter, 'Helvetica Neue', Arial, 'Noto Sans CJK JP', 'Hiragino Sans', sans-serif"
body = "Inter, 'Helvetica Neue', Arial, 'Noto Sans CJK JP', 'Hiragino Sans', sans-serif"
mono = "'JetBrains Mono', 'DejaVu Sans Mono', Menlo, monospace"

[terminal]
# VHS settings (https://github.com/charmbracelet/vhs#settings).
font_family = "JetBrains Mono"
# Layout pixels (multiplied by [video] scale). 36 gives about 84 columns
# by 22 rows: readable on a laptop screen at 1080p.
font_size = 36
padding = 48
typing_speed = "55ms"
prompt = "alice@home"
window_bar = "Colorful"

[terminal.colors]
background = "#10242f"
foreground = "#f4efe6"
cursor = "#f2a541"
selection = "#2f5566"
black = "#10242f"
red = "#e07a5f"
green = "#81b29a"
yellow = "#f2a541"
blue = "#6fa8dc"
magenta = "#c38fd6"
cyan = "#4fb3a9"
white = "#f4efe6"
brightBlack = "#5d7a86"
brightRed = "#f09a80"
brightGreen = "#a3d0b8"
brightYellow = "#f7c37a"
brightBlue = "#9cc4ea"
brightMagenta = "#d9b1e6"
brightCyan = "#7fd1c8"
brightWhite = "#ffffff"

# One table per narration language. A translation (script.<lang>.md) needs one.
# engine: kokoro (synthesized) or silent (timed silence, for drafts and tests).
[narration.en]
engine = "kokoro"
voice = "af_heart"
lang = "en-us"
speed = 1.0

# How the voice says words it gets wrong, wherever they appear: a respelling,
# or IPA phonemes between slashes (see docs/videos/README.md). The captions
# keep the word.
[narration.en.pronounce]
IRA = "/ˌaɪˌɑːɹˈeɪ/"
WSL = "W S L"
Jupyter = "Jupiter"
JupyterLab = "Jupiter Lab"
jupyter = "jupiter"
# Said as one word without a break, and "if" ran into the next word with a
# pause alone (comma, dashes, periods); stressing "if" as much as "what"
# keeps the two words apart (Bob chose it from samples, #376).
"what-if" = "/wˈʌt ˈɪf/"
"What-if" = "/wˈʌt ˈɪf/"
"what-ifs" = "/wˈʌt ˈɪfs/"
"What-ifs" = "/wˈʌt ˈɪfs/"

[narration.ja]
engine = "kokoro"
voice = "jf_alpha"
lang = "ja"
speed = 1.0
