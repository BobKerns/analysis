# What every video on the channel shares: settings, and the wording around
# each video's own [youtube] summary and list (#395). See README.md,
# "Publishing on YouTube".

# Applied when a video is uploaded. A later publish only updates titles,
# descriptions and tags, so privacy is changed in Studio after a look.
privacy = "private"
# Education (27) suits how-to series; YouTube uses it as a hint for
# recommendations and search. Others: 26 Howto & Style, 28 Science & Technology.
category_id = 27
made_for_kids = false
license = "creativeCommon"  # Creative Commons Attribution; "youtube" is the standard license
embeddable = true
# Altered or synthetic content: YouTube asks for it on realistic content a
# viewer could mistake for real people, places or events. The voice is
# synthesized, but it narrates drawn characters and a real terminal.
contains_synthetic_media = false
# Only takes effect for a video that goes up public; a private upload
# notifies no one, and Studio asks again when you publish it.
notify_subscribers = true
# The API can't set these; set them once in Studio, Settings, Upload
# defaults, and check them on the first upload: age restriction (none),
# paid promotion (no), automatic places (off), caption certification
# (never aired on U.S. television), remixing (not allowed).

# Titles must show whole: YouTube cuts long ones off in lists, on phones
# and beside a playing video. `check` refuses a title wider than this, with
# a CJK character counting as two; a script's [youtube] title shortens it
# (it needn't match the title card).
title_width = 50

# Every video's tags; a language's and a video's own come after these.
tags = ["retirement planning", "retirement simulator", "financial planning", "Monte Carlo", "Python"]

# Per language. {number} is the video folder's prefix (03, 02a); {title} is
# the script's [youtube] title, else its front matter title. In previous and
# next, {episode} and {title} are the neighbor's; its link follows once it's
# up. version_label introduces the link to this language's version from the
# other languages' descriptions.
[en]
title = "Retirement Simulator: {number}—{title}"
playlist = "Retirement Simulator Guide"
version_label = "English version"
in_this_video = "In this video:"
chapters = "Chapters:"
first_chapter = "Introduction"
footer = "Alice and Bill are made-up people, and their numbers are examples, not advice."
previous = "Previous: {episode}, {title}"
next = "Next: {episode}, {title}"

[ja]
# The English prefix stays, so both languages sort together on the channel.
title = "Retirement Simulator: {number}—{title}"
playlist = "Retirement Simulator (日本語)"
version_label = "日本語版"
in_this_video = "この回の内容:"
chapters = "チャプター:"
first_chapter = "はじめに"
footer = """
画面のコマンドと出力は英語のままです。日本語字幕があります。
アリスとビルは架空の人物で、金額は例です。助言ではありません。"""
previous = "前回: {episode} {title}"
next = "次回: {episode} {title}"
tags = ["老後資金", "資金計画", "シミュレーション"]
