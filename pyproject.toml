[project]
name = "analysis"
version = "0.1.0"
description = "Personal finance analysis and planning tools"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "click>=8.4.1",
  "gitpython>=3.1.57",
  "ipywidgets>=8.1.8",
  "matplotlib>=3.10.9",
  "pandas>=3.0.3",
  "rich>=15.0.0",
  "ipykernel>=7.2.0",
  "jupyterlab>=4.5.7",
]

[project.scripts]
analysis = "analysis.cli:main"
amazon = "analysis.amazon.cli:amazon_group_command"
sim = "analysis.sim.cli:sim_group_command"

[dependency-groups]
dev = [
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.14",
]

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
