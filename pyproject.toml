[project]
name = "analysis"
version = "0.1.0"
description = "Personal finance analysis and planning tools"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "click>=8.1",
  "pandas>=2.2",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29",
  "jupyterlab>=4.2",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
