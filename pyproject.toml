[project]
name = "analysis"
version = "0.1.0"
description = "Personal finance analysis and planning tools"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "click>=8.5.0",
  "gitpython>=3.1.62",
  "ipywidgets>=8.1.9",
  "matplotlib>=3.11.1",
  "pandas>=3.0.5",
  "rich>=15.0.0",
  "ipykernel>=7.3.0",
  "jupyterlab>=4.6",
]

[project.scripts]
analysis = "analysis.cli:main"
amazon = "analysis.amazon.cli:amazon_group_command"
sim = "analysis.sim.cli:sim_group_command"

[dependency-groups]
dev = [
  "nbstripout>=0.9.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.6",
]

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

