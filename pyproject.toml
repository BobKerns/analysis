[project]
name = "analysis"
version = "0.1.0"
description = "Personal finance analysis and planning tools"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "click>=8.3.3",
  "pandas>=3.0.3",
]

[dependency-groups]
dev = [
  "ipykernel>=7.2.0",
  "jupyterlab>=4.5.7",
  "pytest>=9.0.3",
  "pytest-cov>=7.1.0",
  "ruff>=0.15.12",
]

[build-system]
requires = ["hatchling>=1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
