[project]
name = "analysis"
version = "0.1.0"
description = "Personal finance analysis and planning tools"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "click>=8.5.0",
  "gitpython>=3.2.0",
  "ipywidgets>=8.1.9",
  "matplotlib>=3.11.2",
  "pandas>=3.0.6",
  "rich>=15.0.0",
  "ipykernel>=7.4.0",
  "jupyterlab>=4.6.4",
  "numpy>=2.5.3",
  "scipy>=1.18.1",
]

[project.scripts]
analysis = "analysis.cli:main"
amazon = "analysis.amazon.cli:amazon_group_command"
sim = "analysis.sim.cli:sim_group_command"

[dependency-groups]
dependabot = [
    "bleach>=6.4.0",
    "pillow>=12.3.0",
]
dev = [
  "nbstripout>=0.9.1",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
  "ruff>=0.16.10",
  "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "uses_current_scenario_write: exempt from the no-op write_current_scenario fixture (see tests/conftest.py)",
    "allow_negative_balance: exempt from the negative-balance-is-an-error fixture (see tests/conftest.py)",
]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["I001", "F541"]

